# SystemBase Nginx 路由片段（由 nginx-setup.sh 替换占位符后生成到 /etc/nginx/snippets/<APP_NAME>-locations.conf）
# 被本应用站点 server 块 include；配置了 SITE_PATH（如 /systembase-pre）时，
# 还会被注入到共享域名（SITE_DOMAIN）已有的 server 块中，实现 https://域名/systembase-pre 访问。
# 占位符：__PREFIX__（SITE_PATH，留空 = 根路径部署）、__PORT__（后端端口）、__APP_DIR__（部署目录）
# 注意：使用 alias 而非 root —— 片段可能被 include 进任意 server 块，不能依赖其 root 指向

# ---- 后端 API：剥掉路径前缀转给后端（/systembase-pre/api/x → /api/x） ----
location __PREFIX__/api/ {
    proxy_pass http://127.0.0.1:__PORT__/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;   # 日志下载等较慢接口
    # 与后端 BODY_LIMIT 同量级（后端返回统一结构 413；这里兜底，共享域名 server 块内独立生效）
    client_max_body_size 10m;
}

# ---- 静态资源：文件名带 hash，长缓存 ----
location __PREFIX__/assets/ {
    alias __APP_DIR__/current/apps/web/dist/assets/;
    expires 30d;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
}

# ---- history 路由 fallback；index.html 不缓存，发版后立即生效 ----
location __PREFIX__/ {
    alias __APP_DIR__/current/apps/web/dist/;
    index index.html;
    try_files $uri $uri/ __PREFIX__/index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
