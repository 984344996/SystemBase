# SystemBase Nginx 站点（服务器直接部署用；Docker 部署用 deploy/nginx/nginx.conf）
# 由 setup-server.sh 安装，占位符安装时替换：__APP_DIR__ 部署目录 / __PORT__ 后端端口
server {
    listen 80;
    server_name _;
    server_tokens off;

    # 与后端 BODY_LIMIT 同量级（后端返回统一结构 413；这里是网关兜底）
    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1k;

    # 前端：指向 current 软链，切换版本无需 reload nginx
    root __APP_DIR__/current/apps/web/dist;
    index index.html;

    # ---- 后端 API（同域，免跨域） ----
    location /api/ {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # 日志下载等较慢接口
    }

    # ---- 静态资源：文件名带 hash，长缓存 ----
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ---- history 路由 fallback；index.html 不缓存，发版后立即生效 ----
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
