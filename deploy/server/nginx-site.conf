# SystemBase Nginx 站点（服务器直接部署用）
# 由 nginx-setup.sh 安装，占位符安装时替换：
#   __LISTEN__       Nginx 监听端口（env: SITE_PORT，默认 80；同机多环境时各环境必须不同）
#   __SERVER_NAME__  站点域名（env: SITE_DOMAIN，多个用空格分隔；留空则为 _）
#   __APP_NAME__     应用名（对应 snippets/<APP_NAME>-locations.conf）
# 具体路由（API 反代 / 静态资源 / SPA fallback，支持 SITE_PATH 子路径前缀）统一在
# snippets/<APP_NAME>-locations.conf 中维护；该片段同时会被注入到共享域名
# （SITE_DOMAIN 指向的已有 server 块），实现 https://域名/子路径 访问
server {
    listen __LISTEN__;
    server_name __SERVER_NAME__;
    server_tokens off;

    # 与后端 BODY_LIMIT 同量级（后端返回统一结构 413；这里是网关兜底）
    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1k;

    include /etc/nginx/snippets/__APP_NAME__-locations.conf;
}
